name: Ανάπτυξη Cloudflare API
# Re-run to synchronize rotated ADMIN_SETUP_KEY (2026-11-03)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-deploy.yml'
      - 'api/**'
permissions:
  contents: read
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Εγκατάσταση εξαρτήσεων
        run: npm install
      - name: Δημιουργία ή εύρεση D1
        id: database
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database';
            const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'};
            let r=await fetch(root+'?per_page=100',{headers});
            let j=await r.json();
            if(!r.ok||!j.success)throw new Error('Cannot list D1 databases: '+JSON.stringify(j.errors));
            let db=j.result.find(x=>x.name==='building-manager-db');
            if(!db){
              r=await fetch(root,{method:'POST',headers,body:JSON.stringify({name:'building-manager-db',primary_location_hint:'weur'})});
              j=await r.json();
              if(!r.ok||!j.success)throw new Error('Cannot create D1 database: '+JSON.stringify(j.errors));
              db=j.result;
            }
            if(!/^[a-f0-9-]{36}$/i.test(db.uuid))throw new Error('Unexpected D1 database ID');
            const path='wrangler.toml';
            const original=fs.readFileSync(path,'utf8');
            fs.writeFileSync(path,original.replace(/database_id = "[^"]+"/,'database_id = "'+db.uuid+'"'));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'database_id='+db.uuid+'\n');
            console.log('D1 database ready: '+db.name);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Εφαρμογή αλλαγών βάσης
        run: npx wrangler d1 migrations apply building-manager-db --remote
      - name: Έλεγχος σχήματος ειδοποιήσεων
        run: |
          npx wrangler d1 execute building-manager-db --remote --command "SELECT name,sql FROM sqlite_master WHERE name IN ('payment_declarations','payment_notification_reads');"
      - name: Έλεγχος σχήματος πληρωμών
        run: |
          npx wrangler d1 execute building-manager-db --remote --command "PRAGMA table_info(payments);"
          npx wrangler d1 execute building-manager-db --remote --command "SELECT version FROM d1_migrations ORDER BY version DESC LIMIT 8;"
      - name: Δημοσίευση API
        run: npx wrangler deploy
      - name: Δημιουργία αρχικού διαχειριστή
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::notice::Add ADMIN_EMAIL and ADMIN_PASSWORD secrets to provision the administrator."
            exit 0
          fi
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const email=process.env.ADMIN_EMAIL.trim().toLowerCase();
          const password=process.env.ADMIN_PASSWORD;
          if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||password.length<12||password.length>128)throw Error('Invalid admin credentials');
          const salt=crypto.randomBytes(32).toString('hex');
          const hash=crypto.pbkdf2Sync(password,salt,100000,32,'sha256').toString('hex');
          const esc=x=>x.replace(/'/g,"''");
          const sql="UPDATE users SET salt='"+salt+"',password_hash='"+hash+"' WHERE email='"+esc(email)+"' AND role='admin'; INSERT INTO users(id,email,salt,password_hash,role,created_at) SELECT '"+crypto.randomUUID()+"','"+esc(email)+"','"+salt+"','"+hash+"','admin','"+new Date().toISOString()+"' WHERE NOT EXISTS (SELECT 1 FROM users WHERE role='admin');";
          fs.writeFileSync('admin-provision.sql',sql,{mode:0o600});
          NODE
          trap 'rm -f admin-provision.sql' EXIT
          npx wrangler d1 execute building-manager-db --remote --file=admin-provision.sql
      - name: Έλεγχος σύνδεσης διαχειριστή
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          (async()=>{
            if(!process.env.ADMIN_EMAIL||!process.env.ADMIN_PASSWORD)throw Error('Missing admin credentials');
            const base='https://building-manager-api.george-stathopoulos.workers.dev';
            const health=await fetch(base+'/api/health');
            if(!health.ok)throw Error('API health failed: HTTP '+health.status);
            const res=await fetch(base+'/api/login',{method:'POST',headers:{'Content-Type':'application/json','Origin':'https://george-stathopoulos.github.io'},body:JSON.stringify({email:process.env.ADMIN_EMAIL,password:process.env.ADMIN_PASSWORD})});
            const body=await res.json().catch(()=>({}));
            if(!res.ok)throw Error('Admin login failed: HTTP '+res.status+' '+String(body.error||'unknown'));
            if(!body.token)throw Error('Login did not return session token');
            const overview=await fetch(base+'/api/overview',{headers:{Authorization:'Bearer '+body.token,'Origin':'https://george-stathopoulos.github.io'}});
            if(!overview.ok)throw Error('Overview failed: HTTP '+overview.status);
            const authHeaders={Authorization:'Bearer '+body.token,'Origin':'https://george-stathopoulos.github.io'};
            const fuel=await fetch(base+'/api/fuel/accounts',{headers:authHeaders});
            if(!fuel.ok)throw Error('Fuel accounts failed: HTTP '+fuel.status);
            const fuelData=await fuel.json();
            if(!Array.isArray(fuelData.accounts)||fuelData.accounts.length!==6)throw Error('Fuel accounts must list six apartments for admin');
            const announcement=await fetch(base+'/api/announcements',{headers:authHeaders});
            if(!announcement.ok)throw Error('Announcements failed: HTTP '+announcement.status);
            const announcementData=await announcement.json();
            if(!Array.isArray(announcementData.announcements))throw Error('Announcements response invalid');
            const declarations=await fetch(base+'/api/payment-declarations',{headers:authHeaders});
            const declarationsBody=await declarations.json().catch(()=>({}));
            if(!declarations.ok||!Array.isArray(declarationsBody.declarations))throw Error('Payment declarations failed: HTTP '+declarations.status+' '+String(declarationsBody.error||'invalid response'));
            console.log('Admin login, overview, fuel accounts and announcements passed');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

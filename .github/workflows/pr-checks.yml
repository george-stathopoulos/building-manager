name: Pull request checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/heating-hours-summary]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: cd api && npm install && npm run check

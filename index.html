<!doctype html>

<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#073347"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="Σάμου 4"/><meta name="description" content="Διαχείριση κοινοχρήστων και θέρμανσης πολυκατοικίας"/>

<link rel="icon" href="/building-manager/icon.svg" type="image/svg+xml"/><title>Π Σάμου 4</title><style>#samou-splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 60%,#0b7285,#073347 72%);display:grid;place-content:center;justify-items:center;gap:26px;color:white;transition:opacity .5s ease,visibility .5s}#samou-splash.splash-done{opacity:0;visibility:hidden;pointer-events:none}#samou-splash img{width:min(53vw,210px);height:auto;border-radius:32px;box-shadow:0 16px 70px #001d2c66;animation:samou-appear .8s ease-out both,samou-float 2.2s ease-in-out .8s infinite alternate}#samou-splash strong{font:800 22px system-ui,sans-serif;letter-spacing:.04em}#samou-splash .splash-wave{width:150px;height:5px;border-radius:10px;background:linear-gradient(90deg,transparent,#57e2e8,transparent);animation:samou-wave 1.3s ease-in-out infinite}@keyframes samou-appear{from{opacity:0;transform:translateY(18px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes samou-float{to{transform:translateY(-7px)}}@keyframes samou-wave{0%,100%{opacity:.35;transform:scaleX(.65)}50%{opacity:1;transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){#samou-splash img,#samou-splash .splash-wave{animation:none}}</style>
</head><body><div id="samou-splash" role="status" aria-label="Φόρτωση εφαρμογής"><img src="/building-manager/icon.svg" alt="Π Σάμου 4"/><strong>Σάμου 4</strong><span class="splash-wave" aria-hidden="true"></span></div><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
